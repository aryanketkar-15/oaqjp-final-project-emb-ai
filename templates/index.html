<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered Emotion Detector using IBM Watson NLP - analyze the emotional tone of any text instantly.">
    <title>Emotion Detector | AI-Powered Sentiment Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #a78bfa;
            --accent: #f472b6;
            --bg-dark: #0a0a1a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-input: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --joy: #facc15;
            --anger: #f87171;
            --sadness: #60a5fa;
            --fear: #a78bfa;
            --disgust: #4ade80;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px; height: 500px;
            background: var(--primary);
            top: -150px; left: -150px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px; height: 400px;
            background: var(--accent);
            bottom: -100px; right: -100px;
            animation-delay: -4s;
        }

        .orb-3 {
            width: 300px; height: 300px;
            background: var(--secondary);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        /* Layout */
        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 48px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--secondary);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .badge::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--secondary);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            line-height: 1.1;
            background: linear-gradient(135deg, #f1f5f9 0%, var(--secondary) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
            max-width: 520px;
            margin: 0 auto;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            margin-bottom: 24px;
        }

        .card-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            min-height: 130px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        textarea::placeholder {
            color: #475569;
        }

        textarea:focus {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .btn-analyze {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 20px;
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 14px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 24px rgba(99, 102, 241, 0.3);
        }

        .btn-analyze:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.45);
        }

        .btn-analyze:active {
            transform: translateY(0);
        }

        .btn-analyze .icon {
            font-size: 18px;
        }

        /* Result area */
        #resultContainer {
            display: none;
        }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .result-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
        }

        /* Emotion bars */
        .emotion-bars {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }

        .emotion-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .emotion-label {
            width: 72px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: capitalize;
            flex-shrink: 0;
        }

        .bar-track {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 100px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 100px;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bar-joy { background: linear-gradient(90deg, var(--joy), #fde68a); }
        .bar-anger { background: linear-gradient(90deg, var(--anger), #fca5a5); }
        .bar-sadness { background: linear-gradient(90deg, var(--sadness), #93c5fd); }
        .bar-fear { background: linear-gradient(90deg, var(--fear), #c4b5fd); }
        .bar-disgust { background: linear-gradient(90deg, var(--disgust), #86efac); }

        .emotion-score {
            width: 42px;
            text-align: right;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        /* Dominant emotion pill */
        .dominant-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: capitalize;
            border: 1px solid transparent;
            animation: badgePop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes badgePop {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .dominant-joy    { background: rgba(250,204,21,0.15); border-color: rgba(250,204,21,0.3); color: var(--joy); }
        .dominant-anger  { background: rgba(248,113,113,0.15); border-color: rgba(248,113,113,0.3); color: var(--anger); }
        .dominant-sadness{ background: rgba(96,165,250,0.15); border-color: rgba(96,165,250,0.3); color: var(--sadness); }
        .dominant-fear   { background: rgba(167,139,250,0.15); border-color: rgba(167,139,250,0.3); color: var(--fear); }
        .dominant-disgust{ background: rgba(74,222,128,0.15); border-color: rgba(74,222,128,0.3); color: var(--disgust); }
        .dominant-error  { background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.25); color: #f87171; }

        .dominant-section {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .dominant-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Error */
        .error-msg {
            color: #f87171;
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.2);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 14px;
            font-weight: 500;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .spinner {
            width: 20px; height: 20px;
            border: 2px solid rgba(99,102,241,0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Emotion emojis */
        .emotion-icon { font-size: 16px; }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 48px;
            color: #334155;
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card, .result-card { padding: 24px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="badge">Watson NLP Powered</div>
            <h1>Emotion Detector</h1>
            <p class="subtitle">Instantly analyze the emotional tone of any text using IBM Watson's advanced NLP engine.</p>
        </header>

        <!-- Input Card -->
        <div class="card">
            <div class="card-label">Enter your text</div>
            <textarea
                id="textToAnalyze"
                placeholder="Type something like: 'I am so excited about this opportunity!' or 'This is really frustrating me...'"
                rows="5"
            ></textarea>
            <button class="btn-analyze" id="analyzeBtn" onclick="RunSentimentAnalysis()">
                <span class="icon">🧠</span>
                Analyze Emotions
            </button>
        </div>

        <!-- Result Container -->
        <div id="resultContainer">
            <div class="result-card">
                <div class="result-title">Analysis Result</div>
                <div id="resultContent"></div>
            </div>
        </div>

        <footer>
            Emotion Detector &mdash; IBM AI Application Development Final Project &bull; Watson NLP Library
        </footer>
    </div>

    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
